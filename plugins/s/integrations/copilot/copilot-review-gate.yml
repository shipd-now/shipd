# shipd-copilot v{version}
#
# Bridges GitHub Copilot code review into the `semantic-review` commit status,
# so a branch protection requiring that context is satisfied by the Copilot
# run instead of hanging forever at "Expected — waiting for status". Installed
# and upgraded by `shipd copilot add`; edit the template in the shipd plugin
# (integrations/copilot/), not this copy.
#
# What it does:
#
#   * On a pull request opening or updating, it posts `semantic-review` =
#     pending on the new head commit, so a review of an older commit never
#     counts for a newer one.
#   * On Copilot submitting a review of the current head, it reads the verdict
#     marker the shipd review skill ends its body with and posts the matching
#     state: `<!-- shipd-verdict: fix-required -->` fails the check,
#     `<!-- shipd-verdict: ship-it -->` passes it.
#   * A review carrying neither marker passes, fail-open, with a description
#     saying no verdict was parsed. Skill pickup is relevance-driven, so a
#     Copilot review that ignored the skill must not brick the merge.
#
# Triggering the review itself stays GitHub-side — request Copilot as a
# reviewer on the pull request, or require Copilot code review in a branch
# ruleset. Nothing here asks for a review.
#
# Known limit: on a pull request from a fork the workflow token is read-only,
# so the status cannot be posted there. Same-repository branches are
# unaffected. Where the gate cannot post, the session review flow
# (`review_gate.py post`) still sets the same context.

name: shipd semantic review gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  statuses: write

jobs:
  pending:
    name: Mark semantic-review pending on the new head commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post the pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context=semantic-review \
            -f description="Waiting for the Copilot code review of this commit."

  bridge:
    name: Bridge the Copilot review verdict into semantic-review
    # Only Copilot's own review counts, and only of the commit that is
    # currently the head: a stale review of an older commit is ignored.
    if: >-
      github.event_name == 'pull_request_review'
      && github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
      && github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    steps:
      - name: Post the verdict status
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          # The blocking verdict is tested first, so a body carrying both
          # markers blocks rather than passes.
          #
          # The match is a pure-bash substring test, never a pipe into grep:
          # `grep -q` exits at its first match, so on a review body larger
          # than the pipe buffer the writer dies of SIGPIPE, `pipefail` makes
          # the matched condition false, and a fix-required verdict would fall
          # through to the fail-open branch and post success. Review bodies
          # reach 65,536 characters, well past that buffer.
          if [[ "$REVIEW_BODY" == *'<!-- shipd-verdict: fix-required -->'* ]]; then
            state=failure
            description="Copilot code review: fix required."
          elif [[ "$REVIEW_BODY" == *'<!-- shipd-verdict: ship-it -->'* ]]; then
            state=success
            description="Copilot code review: ship it."
          else
            state=success
            description="Copilot reviewed this commit; no verdict marker was parsed."
          fi
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$state" \
            -f context=semantic-review \
            -f description="$description"
