# shipd-copilot v{version}
#
# Turns a semantic code review of a pull request into the `semantic-review`
# commit status, so a branch protection requiring that context is satisfied by
# the review instead of hanging forever at "Expected — waiting for status".
# Installed and upgraded by `shipd copilot add`; edit the template in the shipd
# plugin (integrations/copilot/), not this copy.
#
# Two reviewer modes, chosen by whether the repository configures a
# COPILOT_GITHUB_TOKEN secret (a fine-grained PAT carrying the account-level
# "Copilot Requests" permission):
#
#   * CLI reviewer — the secret is set. This workflow performs the review
#     itself: it checks the reviewed commit out, installs the engine's optional
#     tooling and a pinned `@github/copilot` CLI, and runs that CLI headless
#     over the base ref's copy of .github/skills/code-review/SKILL.md. The
#     workflow itself first runs the engine's `files` and `diff` with the base
#     first and the head second (the base ref's copy of the engine, so the
#     change under review cannot rewrite it) and hands the saved output to the
#     reviewer, which authors its own report, so the verdict marker is
#     really produced and the resulting status is a strict one. The review text
#     is published as a pull-request review — carrying one anchored inline
#     comment per finding this workflow could verify against the diff it read
#     itself — so a human reads whatever the gate judged, on the lines it is
#     about. This works on private repositories, and spends Copilot AI credits
#     per review (order of ten for a small one).
#   * Poll fallback — no secret. GitHub's own Copilot code review is waited for
#     by polling the reviews API, and whatever it wrote is classified. That
#     surface runs with its bash tool disabled and assembles the review body in
#     its own pipeline, so the shipd engine never executes there and no verdict
#     marker is ever authored: in practice this mode fails open, and its
#     operative guarantee is "Copilot reviewed this commit". It costs nothing
#     and needs no secret, which is why it stays the default.
#
# What it does:
#
#   * On a pull request opening or updating, it posts `semantic-review` =
#     pending on the new head commit — so a review of an older commit never
#     counts for a newer one — and then produces the verdict in whichever mode
#     is configured.
#   * On a review of the current head Copilot submits through an event GitHub
#     does route here, it classifies that event's body directly.
#   * Either way the verdict is the last line of the reviewed text that is
#     EQUAL to a marker — the marker the shipd review skill ends its report
#     with — found by scanning backwards over at most the final 200 lines,
#     and the matching state is posted:
#     `<!-- shipd-verdict: fix-required -->` fails the check,
#     `<!-- shipd-verdict: ship-it -->` passes it. A marker quoted anywhere
#     else in the text — mid-sentence, or inside the reviewer transcript's
#     own tool-call log — is prose, not a verdict, and counts for nothing.
#   * Text carrying no such line passes, fail-open, with a description
#     saying no verdict was parsed. Skill pickup is relevance-driven, so a
#     review that ignored the skill must not brick the merge.
#
# Strictness knob: a repository that has ruled the opposite — that an
# unparsed verdict must never green the required check — sets the repository
# Actions variable SHIPD_GATE_FAIL_OPEN to `false`
# (`gh variable set SHIPD_GATE_FAIL_OPEN --body false`). Every marker-less
# outcome then logs that no verdict was parsed and leaves the status
# `pending`, on all three classify paths alike; the session review flow
# (`review_gate.py post`) is the manual out. The CLI reviewer still publishes
# the text it captured as a review there — a review no status was
# derived from is the one an operator most needs to read. Unset, or set to
# anything else,
# keeps the fail-open default above. It is a variable rather than a local edit
# to this file because `shipd copilot add` reinstalls the template and would
# revert such an edit on the next upgrade.
#
# Why the fallback polls rather than waiting to be told: Copilot submits its
# review from inside a dynamic Actions run, with the workflow-scoped token, and
# GitHub does not start workflow runs from events raised by such a token. No
# `pull_request_review` run ever fires for a Copilot-authored submission —
# measured twice, against human reviews of the same repository that triggered
# runs within three seconds. The `pull_request` run is therefore the only one
# that reliably exists, so it is the one that waits. The
# `pull_request_review` path is kept for any submission GitHub does route.
#
# Fail closed on a review that covered nothing: when the engine fails, or
# reports 0 files while the pull request changes at least one (or its file
# list cannot be read), the review is "not grounded". The gate then submits no
# APPROVE or REQUEST_CHANGES, never arms fast-pass, ignores
# SHIPD_GATE_FAIL_OPEN, re-posts `semantic-review` as `pending` with a "Review
# not grounded" description, publishes any captured text as a COMMENT opening
# with a "Not a verdict" notice, and fails the job. The grounding outcome and
# count cross to the later steps as step outputs, which the reviewer cannot
# rewrite, never as workspace files. The posted body is the report alone: the
# CLI runs with `-s`, and the publisher cuts the text to the last `## Findings`
# header through the verdict marker before classifying it.
# The posted body then opens with the brand line `**☕ shipd** semantic
# review` and a blank line (never doubled), like a `/s:review` post.
#
# Timeout semantics: a CLI run that exits nonzero or exceeds its bound, and a
# poll that finds no review of its head within its window, both leave the status
# `pending` and **fail the job**. Nothing was judged, so no verdict is invented;
# the session review flow (`review_gate.py post`) sets the same context by hand
# where a run cannot. Exiting zero on those paths was wrong: it reported a
# passing run over a review that never happened and left the pull request
# blocked on a status that would never arrive, with nothing in the run's own
# result saying why. The job's exit code is what tells a human the reviewer
# broke rather than merely ran slow — a moved head is the one poll outcome that
# still exits zero, because that run is not stalled, it handed the gate to the
# newer push's own run. The status is posted before any provisioning, so a
# failure anywhere later still leaves the required check reading `pending`
# rather than unreported. The concurrency group below caps the cost at one live
# run per pull request, and a new push cancels the run it supersedes.
#
# Secrets, and the trust boundary they draw: the only secret this workflow
# reads is the optional COPILOT_GITHUB_TOKEN, and its value reaches nothing but
# the Copilot CLI's own environment. Every `gh` call authenticates with the
# workflow's own `github.token`, which lives in a different step — the reviewer
# runs `--allow-all-tools` on a diff whose content it cannot be trusted not to
# be steered by, so the two credentials never share a process:
#
#   * The CLI step's environment binds COPILOT_GITHUB_TOKEN and nothing else.
#     That PAT is documented as a minimal one — no repository access, only the
#     account-level "Copilot Requests" permission — so a steered reviewer holds
#     no credential with which to post a status, comment, or push: it can spend
#     credits and write a misleading report, and that is the worst of it.
#   * The grounding step binds neither the secret nor `github.token`. It runs
#     the base ref's copy of the engine and writes only runner-temp files and
#     its own step outputs; the classify-and-post step trusts those outputs
#     (bound by expression, so no earlier step can overwrite them) and ignores
#     the files, which the reviewer can rewrite.
#   * The classify-and-post step's environment binds `github.token` and not the
#     secret. It reads the captured text out of a workspace file and decides
#     the status by this workflow's own rules, never the reviewer's — and it
#     trusts neither of the channels an earlier step can write to, invoking
#     `gh` by absolute path (against a $GITHUB_PATH shim) and re-binding
#     SHIPD_GATE_FAIL_OPEN from `vars` in its own step env (against a
#     $GITHUB_ENV write). See that step's own commentary below.
#   * The `resolve-threads` job is the only one granted `contents: write`,
#     which GitHub requires for resolving a review thread. It runs after the
#     `gate` job has posted a grounded decision review, checks nothing out,
#     binds no secret, and only calls `gh api graphql`, so the job the
#     reviewer runs in keeps a token that is read-only on contents.
#   * The reviewer's instructions are materialized from the *base* ref, so a
#     change under review cannot rewrite the rules it is reviewed under —
#     falling back to the head's copy only where the base is confirmed not to
#     carry one, and failing the step on any other read failure rather than
#     un-pinning silently — and the CLI is installed at a pinned version
#     rather than whatever the vendor published today.
#
# None of that makes an LLM reviewer immune to content in the diff it reads;
# the session flow (`review_gate.py post`) stays the high-assurance path.
# docs/copilot-review.md states the boundary and its residual risk in full.
#
# Known limit: on a pull request from a fork the workflow token is read-only,
# so the status cannot be posted there. Same-repository branches are
# unaffected.

name: shipd semantic review gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]

# The `gate` job's permissions. The `resolve-threads` job declares its own,
# which replace these for that job alone.
permissions:
  contents: read
  statuses: write
  # `write`, not the `read` the poll alone needed: the CLI reviewer publishes
  # the text it judged as a pull-request review with inline comments.
  pull-requests: write

# One live gate per pull request. A push while a review is running supersedes
# it — the new head's own run owns the gate from then on — and cancelling the
# old run is what stops two runs posting over each other.
# A review by anyone other than Copilot runs in its own group, because its run
# skips its job and must not cancel a live review.
concurrency:
  group: shipd-semantic-review-gate-${{ github.event.pull_request.number }}${{ github.event_name == 'pull_request_review' && github.event.review.user.login != 'copilot-pull-request-reviewer[bot]' && format('-review-{0}', github.event.review.id) || '' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Bridge the semantic review verdict into semantic-review
    # Both triggers land in this one job, so both share one classification.
    # A review event is worth a run only for Copilot's own review of the
    # commit that is currently the head: a stale review of an older commit is
    # ignored.
    if: >-
      github.event_name == 'pull_request'
      || (github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
      && github.event.review.commit_id == github.event.pull_request.head.sha)
    runs-on: ubuntu-latest
    # What the `resolve-threads` job below needs from this one: whether the
    # posting step got a grounded decision review accepted, and for which
    # head. Both are written only after that review posted successfully.
    outputs:
      resolve_threads: ${{ steps.verdict.outputs.resolve_threads }}
      head_sha: ${{ steps.verdict.outputs.head_sha }}
    env:
      # Whether the CLI reviewer mode is configured. A step's `if:` cannot read
      # the `secrets` context at all, so only the *presence* of the secret is
      # hoisted here, as a boolean; the value itself never leaves the one step
      # that runs the CLI. This is what keeps a repository on the poll fallback
      # from paying for a checkout and a toolchain it will not use.
      COPILOT_CLI_REVIEWER: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
      # The strictness knob, read at classify time. An unset variable
      # interpolates to the empty string, which the `:-true` default below
      # reads as the fail-open default; only the literal `false` turns a
      # marker-less outcome into a `pending` that stands.
      SHIPD_GATE_FAIL_OPEN: ${{ vars.SHIPD_GATE_FAIL_OPEN }}
    steps:
      - name: Post the pending semantic-review status for this head
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # First, before any provisioning: whatever fails after this, the
          # required check reads `pending` rather than going unreported. A
          # review event classifies a body that already exists, so it has
          # nothing to wait for and posts no pending of its own.
          #
          # A plain PATH lookup is fine here, unlike in the posting step: this
          # step runs before the reviewer does, so there is no $GITHUB_PATH
          # entry of the reviewer's for a lookup to find.
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state=pending \
              -f context=semantic-review \
              -f description="Waiting for the Copilot code review of this commit."
          fi

      - name: Check out the reviewed commit
        if: >-
          github.event_name == 'pull_request'
          && env.COPILOT_CLI_REVIEWER == 'true'
        uses: actions/checkout@v4
        with:
          # The commit under review itself — not the merge commit — with the
          # history behind it, which the engine's merge-base diff needs.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install difftastic and ripgrep for the review engine
        if: >-
          github.event_name == 'pull_request'
          && env.COPILOT_CLI_REVIEWER == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          difft_version=0.71.0
          curl -fsSL -o /tmp/difft.tar.gz \
            "https://github.com/Wilfred/difftastic/releases/download/${difft_version}/difft-${difft_version}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/difft-release
          tar -xzf /tmp/difft.tar.gz -C /tmp/difft-release
          # The archive layout has varied across releases, so the binary is
          # located by name rather than assumed at the archive root.
          binary="$(find /tmp/difft-release -type f -name difft | head -n 1)"
          # `curl -f` above already fails this step on a non-2xx response (a
          # 404 from a retired or mistyped asset name), so this guard is
          # deliberately for the other failure mode: an archive that
          # downloaded fine but carries no `difft` member. An archive
          # carrying no difft would otherwise reach `install` as an empty
          # source path. Failing here fails this step, which leaves the
          # `pending` posted above standing — the correct outcome for a review
          # that never ran.
          if [[ -z "$binary" ]]; then
            echo "The difftastic release archive contains no difft binary." >&2
            exit 1
          fi
          install -m 0755 "$binary" "$HOME/.local/bin/difft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The grounding, computed by the workflow rather than chosen by the
      # model. A reviewer left to run the engine itself can reverse the refs,
      # see 0 files, and report "no problems" on a pull request it never read;
      # so this step runs the engine's `files` and `diff` with the base first
      # and the head second, saves both outputs for the reviewer to read, and
      # reports the outcome and the files count as step outputs. The reviewer
      # runs with `--allow-all-tools` and can rewrite anything in the runner
      # temp directory, but not an earlier step's outputs, so the publishing
      # step trusts these outputs and never the files. The engine is the base
      # ref's copy, pinned the way the reviewer instructions are, so a pull
      # request cannot rewrite the engine to fake a non-empty grounding. No
      # secret and no `github.token` is bound here, and the step always exits
      # zero so the later steps run and post the `semantic-review` status.
      - name: Ground the review in the engine's own output
        id: grounding
        if: >-
          github.event_name == 'pull_request'
          && env.COPILOT_CLI_REVIEWER == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'pull_request' \
                && "${COPILOT_CLI_REVIEWER:-}" == 'true' ]]; then
            engine_path=".github/skills/code-review/scripts/semdiff.py"
            engine="${RUNNER_TEMP:-.}/shipd-copilot-review-semdiff.py"
            files_json="${RUNNER_TEMP:-.}/shipd-copilot-review-semdiff-files.json"
            diff_json="${RUNNER_TEMP:-.}/shipd-copilot-review-semdiff-diff.json"
            rm -f "$engine" "$files_json" "$diff_json"
            outcome=ok
            files=0
            # Best-effort top-ups, as the reviewer step does: the checkout
            # covers the reviewed commit, not necessarily the base branch.
            git fetch --no-tags --quiet origin "$BASE_SHA" || true
            git fetch --no-tags --quiet origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base_commit="$(git rev-parse --verify --quiet \
              "origin/$BASE_REF^{commit}" || true)"
            if [[ -z "$base_commit" ]]; then
              echo "The base ref $BASE_REF could not be resolved, so the" \
                "review engine cannot be pinned to it; semantic-review is" \
                "not grounded." >&2
              outcome=failed
            elif git cat-file -e "$base_commit:$engine_path" 2>/dev/null; then
              if ! git show "$base_commit:$engine_path" > "$engine"; then
                echo "The base ref $BASE_REF carries $engine_path but it" \
                  "could not be read; semantic-review is not grounded."
                outcome=failed
              fi
            elif [[ -f "$engine_path" ]]; then
              # The pull request that installs the integration: the base has
              # no engine to pin to, so the head copy is used and the run says
              # so.
              echo "The base ref $BASE_REF carries no $engine_path; using" \
                "the head copy of it instead."
              cp "$engine_path" "$engine"
            else
              echo "No review engine at $engine_path; semantic-review is" \
                "not grounded."
              outcome=failed
            fi
            if [[ "$outcome" == ok ]]; then
              if ! python3 "$engine" files "$BASE_SHA" "$HEAD_SHA" \
                  > "$files_json" \
                  || ! python3 "$engine" diff "$BASE_SHA" "$HEAD_SHA" \
                  > "$diff_json"; then
                echo "The review engine failed on $HEAD_SHA; semantic-review" \
                  "is not grounded."
                outcome=failed
              fi
            fi
            if [[ "$outcome" == ok ]]; then
              if ! files="$(python3 -c 'import json, sys; n = json.load(open(sys.argv[1]))["summary"]["files"]; assert type(n) is int and n >= 0; print(n)' "$files_json")"; then
                echo "The review engine's files output carries no summary" \
                  "files count; semantic-review is not grounded."
                outcome=failed
                files=0
              fi
            fi
            echo "outcome=$outcome" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "files=$files" >> "${GITHUB_OUTPUT:-/dev/null}"
          fi

      # The reviewer, alone with its own credential. This step's environment
      # binds the Copilot PAT and nothing else: `github.token` is not here, so
      # a reviewer steered by adversarial content in the diff it is reading
      # cannot post the required status, comment as the workflow, or carry a
      # repository-scoped credential anywhere. What it can reach is bounded by
      # what that PAT grants — Copilot Requests, no repository access — which
      # bounds the worst case at spent credits and a misleading review body
      # the next step publishes for a human to read.
      - name: Review this commit with the Copilot CLI
        if: >-
          github.event_name == 'pull_request'
          && env.COPILOT_CLI_REVIEWER == 'true'
        env:
          # The one repository secret, and the only place its value is bound.
          # `gh` never sees it; the Copilot CLI inherits it from this step's
          # environment, which is the authentication it documents for a
          # headless run.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # The grounding step's outputs, bound from the step expressions: an
          # earlier step cannot overwrite them through $GITHUB_ENV.
          GROUNDING_OUTCOME: ${{ steps.grounding.outputs.outcome }}
          GROUNDING_FILES: ${{ steps.grounding.outputs.files }}
          # The optional reviewer model. Unset, the CLI picks its own default.
          # Bound here in the step's own `env:`, like the posting step's knobs,
          # so no earlier step's $GITHUB_ENV write can choose it.
          SHIPD_REVIEW_MODEL: ${{ vars.SHIPD_REVIEW_MODEL }}
        run: |
          set -euo pipefail
          # The CLI reviewer's runtime bound. This default is what every run on
          # a runner uses — nothing there sets the override, which exists so
          # the test suite can drive a timed-out review through its branch
          # without waiting ten minutes on it.
          cli_timeout="${SHIPD_GATE_CLI_TIMEOUT:-600}"
          # Where the captured review lands. The classifying step runs in its
          # own shell with its own credential, so the workspace file that
          # already held the text is what carries it across that boundary —
          # and whether the file is there is that step's only signal that
          # anything was judged here at all.
          body_file="${RUNNER_TEMP:-.}/shipd-copilot-review-body.md"
          # The findings, as data, beside the text. The posting step anchors
          # them onto the diff — after checking every one against a diff it
          # reads itself — so this file and the body are the whole of what
          # crosses the credential boundary. A reviewer that writes no
          # findings file costs its anchoring, not its review.
          findings_file="${RUNNER_TEMP:-.}/shipd-copilot-review-findings.json"
          # The instructions the reviewer follows, and the path they are
          # installed at.
          instructions_file="${RUNNER_TEMP:-.}/shipd-copilot-review-skill.md"
          skill_path=".github/skills/code-review/SKILL.md"
          # The engine output the grounding step saved, named in the prompt so
          # the model never picks refs.
          grounding_files="${RUNNER_TEMP:-.}/shipd-copilot-review-semdiff-files.json"
          grounding_diff="${RUNNER_TEMP:-.}/shipd-copilot-review-semdiff-diff.json"

          # A review with no grounding judged nothing, so the Copilot run is
          # skipped: it would spend credits on a verdict the publishing step
          # refuses. That step re-posts `pending` and fails the job.
          if [[ "$EVENT_NAME" == 'pull_request' \
                && -n "${COPILOT_GITHUB_TOKEN:-}" \
                && "${GROUNDING_OUTCOME:-}" == 'ok' ]]; then
            # The CLI reviewer. Unlike GitHub's code-review surface, this one
            # can execute the engine and author its own report, which is what
            # makes the resulting status strict rather than fail-open.
            rm -f "$body_file" "$findings_file"
            # Pinned deliberately. An unpinned install would let the CLI
            # vendor change what this gate runs, and so what it decides, on
            # their release schedule; upgrading is a bump of this line in the
            # shipd plugin's template, reviewed like any other change.
            npm install -g @github/copilot@1.0.80
            # The engine diffs base against the reviewed commit with merge-base
            # semantics, so both must be present. The checkout brought the
            # history behind the commit under review; this tops up a base the
            # fetch may not have covered, and is only best-effort because the
            # usual case is that it is already there.
            git fetch --no-tags --quiet origin "$BASE_SHA" || true
            # The instructions are the one input the reviewed change must not
            # be able to rewrite — a change editing the skill would otherwise
            # be reviewed under the rules it is asking for — so they are
            # materialized from the *base* ref into the workspace, and the
            # prompt names that copy rather than the live file. The
            # remote-tracking ref is topped up first: the checkout's fetch
            # covers the reviewed commit, not necessarily the base branch.
            git fetch --no-tags --quiet origin \
              "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            # Falling back is only correct for one cause — the base genuinely
            # not carrying the file — so the two failures are told apart
            # rather than collapsed into one `||`. An unreachable base (the
            # fetch above failed, the ref is gone) would otherwise un-pin the
            # instructions silently, which is the whole thing this pinning
            # exists to prevent: those fail the step, leaving `pending`.
            base_commit="$(git rev-parse --verify --quiet \
              "origin/$BASE_REF^{commit}" || true)"
            if [[ -z "$base_commit" ]]; then
              echo "The base ref $BASE_REF could not be resolved, so the" \
                "reviewer instructions cannot be pinned to it;" \
                "semantic-review stays pending." >&2
              exit 1
            fi
            # `cat-file -e` exits nonzero for a path a readable tree does not
            # carry — the one case the head's copy is the right answer.
            if git cat-file -e "$base_commit:$skill_path" 2>/dev/null; then
              # Overwriting the checkout's own $skill_path, not only the
              # workspace copy the prompt names, is what makes the pin
              # enforced rather than advisory: the CLI's own skill discovery
              # resolves $skill_path in the checkout, so a change editing the
              # review rules would otherwise still be reviewed under the
              # rules it is asking for.
              if ! git show "$base_commit:$skill_path" \
                  | tee "$instructions_file" > "$skill_path"; then
                echo "The base ref $BASE_REF carries $skill_path but it could" \
                  "not be read; semantic-review stays pending." >&2
                exit 1
              fi
            else
              # The pull request that installs the integration: there is no
              # base copy to pin to, so the reviewed commit's own is used and
              # the run says which it reviewed under.
              echo "The base ref $BASE_REF carries no $skill_path; reviewing" \
                "under the reviewed commit's own copy of it instead."
              cp "$skill_path" "$instructions_file"
            fi
            # The prompt defers to the materialized instructions rather than
            # restating the rubric, so one file stays the review contract for
            # both reviewer modes.
            prompt="Review this pull request.

          Follow the review contract in $instructions_file exactly: run the
          bundled engine it names, reason from that structural output, apply
          its severity rubric, and end with the verdict it mandates.

          The workflow has already run the contract's files and diff
          subcommands for this pull request, base $BASE_SHA against the
          reviewed commit $HEAD_SHA, and saved their output:
          the files output is in $grounding_files and the
          diff output is in $grounding_diff. Read those two files as the
          output of steps 1 and 2. Do not run the files or diff subcommands
          yourself; context lookups stay allowed.

          Do not post anything to GitHub yourself: no review, no comment, no
          status, no label. The workflow that invoked you publishes the result.

          Write ONLY the review report on stdout. Its last line must be the
          machine-readable verdict marker the contract specifies, alone on that
          line, with nothing after it.

          Write the machine-readable findings file the contract specifies to
          $findings_file — the workflow reads it from exactly that path to
          anchor your findings onto the diff as inline comments. A finding
          whose path or line range is not in the diff of this pull request is
          folded into the body as prose instead, so give real ones."
            # Only stdout is captured: the CLI writes its report there and its
            # run statistics to stderr, which belongs in the job log rather
            # than in the classified text — folded in, that footer's own
            # lines would be scanned for a verdict marker alongside the
            # report's.
            # `--allow-all-tools` is what lets the CLI run the engine at all,
            # but authorizes tool use — it does not widen the path sandbox,
            # so `--add-dir` is what brings $RUNNER_TEMP (a sibling of the
            # checkout, where $findings_file lives) inside it.
            # A run that fails or is killed judged nothing, so its partial
            # output is dropped: the next step then finds no file, posts
            # nothing further, and the `pending` above stands.
            # `-s` prints only the agent's response, without the run
            # statistics — which is also why the posting step names the
            # model in the footer: the run itself no longer says.
            # `--model` is passed only when SHIPD_REVIEW_MODEL is set. The
            # `${a[@]+…}` form expands an empty array to nothing under
            # `set -u`, which a bare `"${a[@]}"` does not on older bash.
            model_args=()
            if [[ -n "${SHIPD_REVIEW_MODEL:-}" ]]; then
              model_args=(--model "$SHIPD_REVIEW_MODEL")
            fi
            if ! timeout "$cli_timeout" copilot -p "$prompt" -s \
                ${model_args[@]+"${model_args[@]}"} \
                --allow-all-tools --add-dir "${RUNNER_TEMP:-.}" \
                > "$body_file"; then
              echo "The Copilot CLI review of $HEAD_SHA failed or exceeded" \
                "${cli_timeout}s; semantic-review stays pending."
              rm -f "$body_file"
            fi
          elif [[ "$EVENT_NAME" == 'pull_request' \
                  && -n "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            echo "The review engine produced no grounding for $HEAD_SHA;" \
              "skipping the Copilot CLI review, semantic-review stays pending."
            rm -f "$body_file" "$findings_file"
          fi

      # The publisher, alone with the workflow's own credential. The secret is
      # not here: whatever the reviewer wrote, it is this step — running the
      # workflow's own code, not the reviewer's instructions — that decides
      # the status and posts it.
      #
      # A step running after the reviewer inherits two things the reviewer
      # could have written to, so neither is trusted here:
      #
      #   * $GITHUB_PATH — a shim directory prepended to PATH would make the
      #     next step's `gh` the reviewer's own program, running with
      #     `github.token`. So `gh` is invoked by absolute path below.
      #   * $GITHUB_ENV — an exported SHIPD_GATE_FAIL_OPEN=true would turn a
      #     strict repository's `pending` into a `success`. So the knob is
      #     re-bound here from the `vars` context: a step's `env:` is
      #     evaluated as an expression by the runner and cannot be written to
      #     by an earlier step, which makes this binding win over the
      #     job-level one the other steps use.
      - name: Classify the reviewed text and post the verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          SHIPD_GATE_FAIL_OPEN: ${{ vars.SHIPD_GATE_FAIL_OPEN }}
          SHIPD_FAST_PASS: ${{ vars.SHIPD_FAST_PASS }}
          # The model the footer names, re-bound from `vars` for the same
          # reason as the strictness knob: the footer states what this
          # workflow configured, never what an earlier step claims.
          SHIPD_REVIEW_MODEL: ${{ vars.SHIPD_REVIEW_MODEL }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_BODY: ${{ github.event.review.body }}
          # The grounding step's outputs. Like the strictness knob above, they
          # come from step expressions, so an earlier step cannot overwrite
          # them through $GITHUB_ENV.
          GROUNDING_OUTCOME: ${{ steps.grounding.outputs.outcome }}
          GROUNDING_FILES: ${{ steps.grounding.outputs.files }}
        run: |
          set -euo pipefail
          # Every `gh` call in this step goes through this path, not through a
          # PATH lookup: `/usr/bin/gh` is where the GitHub-hosted runner image
          # installs it. Hardcoded on purpose — deliberately *not* an
          # environment override, the way the timing knobs below are. A
          # variable written to $GITHUB_ENV by an earlier step lands in this
          # step's process environment, so a path read from a variable — with
          # this literal as its default — would hand the reviewer the same
          # redirection that invoking `gh` through PATH would: a shim by
          # another name. A step's `env:` cannot express "unset this" the way
          # it re-binds the knob above, so the only way to be sure is to read
          # no variable at all. The test suite rewrites this literal in the
          # extracted script instead.
          gh_bin=/usr/bin/gh
          # The interpreter that builds the review payload below, named the
          # same absolute way and for the same reason: shaping JSON out of a
          # review body and the reviewer's findings needs correct escaping,
          # and a PATH-resolved `python3` in this step would be one more thing
          # a $GITHUB_PATH shim could replace with the reviewer's own program.
          # It holds no credential — it reads two workspace files and writes a
          # third — but it runs in the credentialed step, so it is pinned like
          # `gh` is. The test suite rewrites this literal too.
          py_bin=/usr/bin/python3
          # The poll's cadence and its bound. These defaults are what every run
          # on a runner uses — nothing there sets the overrides, which exist so
          # the test suite can drive the loop through its cycles without
          # waiting minutes on it.
          poll_interval="${SHIPD_GATE_POLL_INTERVAL:-20}"
          poll_timeout="${SHIPD_GATE_POLL_TIMEOUT:-900}"

          # Where the reviewed text lands. It is written by redirection and
          # read back with `$(<file)`: the text is never carried in an
          # environment variable on these paths — review bodies reach 65,536
          # characters, close enough to the 128 KiB per-string limit to
          # matter — and never piped anywhere, for the SIGPIPE reason spelled
          # out below.
          body_file="${RUNNER_TEMP:-.}/shipd-copilot-review-body.md"
          # Set once the reviewed text is this workflow's own work, and so
          # worth showing a human. A Copilot-authored review is already on the
          # pull request and is never re-posted.
          comment_file=

          post_status() {
            "$gh_bin" api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$1" \
              -f context=semantic-review \
              -f description="$2"
          }

          if [[ "$EVENT_NAME" == 'pull_request' \
                && "${COPILOT_CLI_REVIEWER:-false}" == 'true' ]]; then
            # The pull request's own changed-files list, read once and before
            # anything else: it is the count the engine's grounding is
            # checked against, and the diff the payload builder below verifies
            # findings against. That diff has to cover every changed file: a
            # truncated read is indistinguishable downstream from a path the
            # pull request never touched, so it would silently withhold the
            # anchoring a finding was computed for instead of reporting the
            # finding as unplaceable. The read is best effort for anchoring,
            # but a failed read counts as "may hold files" for the grounding
            # check below.
            files_file="${RUNNER_TEMP:-.}/shipd-copilot-review-files.json"
            count_file="${RUNNER_TEMP:-.}/shipd-copilot-review-files-count.txt"
            if ! "$gh_bin" api --paginate \
                "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
                > "$files_file"; then
              echo "The diff of $HEAD_SHA could not be read; the review will" \
                "be posted without inline comments."
              : > "$files_file"
            fi
            # The entries in that list, or `unknown` when it cannot be parsed.
            # An empty file is a failed read, not an empty pull request: a
            # successful read of no files is `[]`.
            "$py_bin" - "$files_file" "$count_file" <<'PY'
          import json
          import sys

          count = "unknown"
          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  text = handle.read()
              decoder = json.JSONDecoder()
              index, total, pages = 0, 0, 0
              while True:
                  while index < len(text) and text[index].isspace():
                      index += 1
                  if index >= len(text):
                      break
                  page, index = decoder.raw_decode(text, index)
                  if not isinstance(page, list):
                      raise ValueError("not a list")
                  total += len(page)
                  pages += 1
              if pages:
                  count = str(total)
          except (OSError, ValueError):
              pass
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write(count)
          PY
            pr_file_count="$(<"$count_file")"
            # Grounded means the engine ran and its files count is believable.
            # A review of 0 files on a pull request that changes at least one
            # (or whose file list could not be read) judged nothing, however
            # confident its marker: it never decides the status. A count of 0
            # on a pull request that really changes no files is grounded.
            ungrounded=
            if [[ "${GROUNDING_OUTCOME:-}" != 'ok' \
                  || ! "${GROUNDING_FILES:-}" =~ ^[0-9]+$ ]]; then
              ungrounded=engine
              ungrounded_description="Review not grounded: the review engine failed on this commit; no verdict posted."
              ungrounded_notice="The review engine failed on this commit, so the text below was not grounded in the pull request's files and no verdict was posted."
            elif [[ "$GROUNDING_FILES" == 0 && "$pr_file_count" != 0 ]]; then
              ungrounded=empty
              if [[ "$pr_file_count" == unknown ]]; then
                seen_of="an unknown number of"
              else
                seen_of="$pr_file_count"
              fi
              ungrounded_description="Review not grounded: the review engine saw 0 of $seen_of changed files; no verdict posted."
              ungrounded_notice="The review engine saw 0 of $seen_of changed files, so the text below was not grounded in the pull request's files and no verdict was posted."
            fi
            if [[ -n "$ungrounded" ]]; then
              echo "$ungrounded_description"
            fi
            # The CLI reviewer's own report, captured by the step above. Its
            # credential is gone from here, so the presence boolean selects
            # this path and the file that step left behind — or did not —
            # says whether there is anything to classify.
            if [[ ! -f "$body_file" ]]; then
              if [[ -n "$ungrounded" ]]; then
                # The reviewer was skipped: nothing was written, so there is
                # no text to publish, only the status to put back.
                post_status pending "$ungrounded_description"
                exit 1
              fi
              echo "The Copilot CLI review of $HEAD_SHA captured no output;" \
                "semantic-review stays pending. Nothing was judged, so no" \
                "verdict is invented — see the reviewer step's own log for" \
                "the cause; an exhausted Copilot quota reports there as" \
                "\"exceeded your monthly quota\"." >&2
              exit 1
            fi
            # Cut the captured text down to the report. The verdict is read
            # from, and the review published as, the same cleaned text. With
            # a verdict marker, the report is the last `## Findings` header
            # before the last marker line, through that marker line; with no
            # marker, from the last header to the end; with no header, the
            # whole text minus the CLI's tool-call transcript blocks.
            report_file="${RUNNER_TEMP:-.}/shipd-copilot-review-report.md"
            "$py_bin" - "$body_file" "$report_file" <<'PY'
          import sys

          MARKERS = ("<!-- shipd-verdict: ship-it -->",
                     "<!-- shipd-verdict: fix-required -->")

          with open(sys.argv[1], encoding="utf-8", errors="replace") as handle:
              text = handle.read().replace("\r", "")
          lines = text.split("\n")


          def last_header(before):
              fallback = None
              for index in range(before - 1, -1, -1):
                  head = lines[index].lstrip()
                  if head.startswith("## Findings:"):
                      return index
                  if fallback is None and head.startswith("## Findings"):
                      fallback = index
              return fallback


          def without_blocks(rows):
              kept, in_block = [], False
              for row in rows:
                  if row.startswith("\u25cf "):
                      in_block = True
                  elif in_block and row.lstrip().startswith(("\u2502", "\u2514")):
                      pass
                  else:
                      in_block = False
                      kept.append(row)
              return kept


          marker = None
          for index in range(len(lines) - 1, -1, -1):
              if lines[index].strip() in MARKERS:
                  marker = index
                  break
          end = len(lines) if marker is None else marker + 1
          start = last_header(end)
          kept = lines[start:end] if start is not None else without_blocks(lines)
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write("\n".join(kept).rstrip("\n") + "\n")
          PY
            body="$(<"$report_file")"
            comment_file="$report_file"
            if [[ -n "$ungrounded" ]]; then
              # An ungrounded review is published for an operator to read, but
              # as a notice-headed COMMENT: it carries no verdict.
              notice_file="${RUNNER_TEMP:-.}/shipd-copilot-review-notice.md"
              {
                printf '**Not a verdict.** %s\n\n' "$ungrounded_notice"
                cat "$report_file"
              } > "$notice_file"
              comment_file="$notice_file"
              body="$(<"$notice_file")"
            fi
            # A marker-less outcome on this path is the gate's own reviewer
            # having produced no verdict, which is a different thing from
            # GitHub's reviewer having produced none — so the status says
            # which reviewer it is describing.
            no_marker_description="The gate's Copilot CLI review of this commit produced no verdict marker."
          elif [[ "$EVENT_NAME" == 'pull_request' ]]; then
            # The poll fallback. Wait for Copilot's review of this head. Each
            # cycle re-reads the pull request's own head as well: once it has
            # moved, the newer push's run owns the gate and this one is
            # finished.
            deadline=$(( SECONDS + poll_timeout ))
            while :; do
              current_head="$("$gh_bin" api --jq '.head.sha' \
                "repos/$REPO/pulls/$PR_NUMBER")"
              if [[ "$current_head" != "$HEAD_SHA" ]]; then
                # Stays zero: this run is not stalled, it handed the gate to
                # the newer push's own run, and failing it would paint a red
                # X on every superseded push.
                echo "The pull request has moved on to $current_head;" \
                  "that push's own run owns the gate."
                exit 0
              fi
              # Reviews come back in submission order, so the last id is
              # Copilot's latest word on this commit.
              review_ids="$("$gh_bin" api --paginate \
                --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" and .commit_id == env.HEAD_SHA) | .id' \
                "repos/$REPO/pulls/$PR_NUMBER/reviews")"
              if [[ -n "$review_ids" ]]; then
                review_id="${review_ids##*$'\n'}"
                "$gh_bin" api --jq '.body' \
                  "repos/$REPO/pulls/$PR_NUMBER/reviews/$review_id" \
                  > "$body_file"
                body="$(<"$body_file")"
                break
              fi
              if (( SECONDS >= deadline )); then
                echo "No Copilot review of $HEAD_SHA within" \
                  "${poll_timeout}s; semantic-review stays pending." >&2
                exit 1
              fi
              sleep "$poll_interval"
            done
          else
            body="$REVIEW_BODY"
          fi

          # The verdict is the LAST line, scanned backwards, that is EQUAL to
          # a marker — never a substring match anywhere in the body, and never
          # only whichever line happens to be last. A review describing a
          # diff may quote the markers verbatim (a pull request that ships the
          # review skill itself quotes both), and the Copilot CLI streams its
          # own session narration after the report on some runs, pushing a
          # real marker off the literal last line without removing it from the
          # text. Trusting only the last line fails open on the second case —
          # posting `success` over a review it never read the verdict of — so
          # the scan walks backwards instead. It examines at most the last 200
          # lines, so a maximal 65,536-character body of short lines cannot
          # make it walk the whole text. One residual window remains: a bare
          # marker standing alone on its own line inside trailing narration is
          # still read as the verdict — accepted as far smaller than the
          # failure this scan replaces.
          #
          # The extraction and every comparison are pure bash — parameter
          # expansion, `(( ))`, `[[ ]]`, and one small function — never a pipe
          # into grep: `grep -q` exits at its first match, so on a review body
          # larger than the pipe buffer the writer dies of SIGPIPE, `pipefail`
          # makes the matched condition false, and a fix-required verdict
          # would fall through to the fail-open branch and post success.
          # Review bodies reach 65,536 characters, well past that buffer.
          #
          # A line's leading whitespace (an indented marker) is trimmed with
          # `%%[![:space:]]*` — the longest suffix starting at the first
          # non-space character, which matches by scanning forward from the
          # start and so stays linear. Trailing whitespace (a marker with
          # spaces appended) is tolerated the same way, but never by hunting a
          # line for where its OWN trailing whitespace begins: `marker_matches`
          # strips the marker's fixed-length text off the front with `#` and
          # then applies that identical `%%` scan to what is left, so its cost
          # is bounded by the tail's own length, not the line's. The `##`
          # equivalent — matching backwards from the last non-space character —
          # is what this replaces: `${body##*[![:space:]]}` retries the
          # leading `*` at every position (65,000 trailing spaces measured at
          # 64s on bash 5.2 and minutes on bash 3.2), and the extglob
          # `${body%%+([[:space:]])}` crashes bash 3.2 outright.
          body="${body//$'\r'/}"
          fix_required_marker='<!-- shipd-verdict: fix-required -->'
          ship_it_marker='<!-- shipd-verdict: ship-it -->'
          marker_matches() {
            # $1: a line with its leading whitespace already trimmed.
            # $2: the exact marker text.
            # True when $1 is the marker optionally followed by whitespace.
            local rest="${1#"$2"}"
            [[ "$rest" == "$1" ]] && return 1   # $1 does not start with $2
            local trailing_ws="${rest%%[![:space:]]*}"
            (( ${#trailing_ws} == ${#rest} ))
          }
          matched_state=
          matched_description=
          scan_body="$body"
          scanned=0
          while (( scanned < 200 )); do
            scanned=$(( scanned + 1 ))
            head="${scan_body%$'\n'*}"
            if (( ${#head} == ${#scan_body} )); then
              line="$scan_body"
              scan_body=""
            else
              line="${scan_body:${#head}+1}"
              scan_body="$head"
            fi
            lead_ws="${line%%[![:space:]]*}"
            line="${line:${#lead_ws}}"
            if marker_matches "$line" "$fix_required_marker"; then
              matched_state=failure
              matched_description="Copilot code review: fix required."
              break
            elif marker_matches "$line" "$ship_it_marker"; then
              matched_state=success
              matched_description="Copilot code review: ship it."
              break
            fi
            [[ -z "$scan_body" ]] && break
          done
          if [[ -n "${ungrounded:-}" ]]; then
            # An ungrounded review never decides the status, whatever marker
            # it carries and whatever SHIPD_GATE_FAIL_OPEN says: `pending` goes
            # back on the commit, no fast-pass arms (the state is not
            # `success`), and the review below is a COMMENT (no parsed
            # verdict).
            matched_state=
            state=pending
            description="$ungrounded_description"
          elif [[ -n "$matched_state" ]]; then
            state="$matched_state"
            description="$matched_description"
          elif [[ "${SHIPD_GATE_FAIL_OPEN:-true}" == "false" ]]; then
            # The strict repository. Nothing was judged, so no status is
            # posted: the `pending` above stands and a human either
            # re-reviews or posts the status by hand with the session flow's
            # `review_gate.py post`. An empty state is what says "post
            # nothing" — the run still falls through to the comment below,
            # because a reviewer text no status was derived from is exactly
            # the one an operator needs to read.
            state=
            description=
            echo "The reviewed text of $HEAD_SHA carried no verdict marker" \
              "and SHIPD_GATE_FAIL_OPEN is false; semantic-review stays" \
              "pending."
          else
            state=success
            # The shared wording, for the two paths that classify a review
            # GitHub's own reviewer wrote; the CLI path set its own above.
            description="${no_marker_description:-Copilot reviewed this commit; no verdict marker was parsed.}"
          fi
          if [[ -n "$state" ]]; then
            post_status "$state" "$description"
          fi

          # Fast-pass: arm auto-merge when eligible. A review is eligible only
          # when the SHIPD_FAST_PASS variable reads `true`, the verdict is
          # `success` (from a ship-it marker, not fail-open), and the body
          # carries the fast-pass marker line.
          fast_pass_marker='<!-- shipd-fast-pass: eligible -->'
          fast_pass_armed=false
          if [[ "${SHIPD_FAST_PASS:-}" == "true" ]]; then
            # The variable is enabled. Check if we have a ship-it verdict
            # (not fail-open).
            if [[ "$state" == "success" && -n "$matched_state" ]]; then
              # We have a ship-it marker (matched_state was set). Now scan
              # for the fast-pass line in the body, bounded to 200 lines.
              found_fast_pass=false
              scan_body="$body"
              scanned=0
              while (( scanned < 200 )); do
                scanned=$(( scanned + 1 ))
                head="${scan_body%$'\n'*}"
                if (( ${#head} == ${#scan_body} )); then
                  line="$scan_body"
                  scan_body=""
                else
                  line="${scan_body:${#head}+1}"
                  scan_body="$head"
                fi
                # Trim leading whitespace
                line_trimmed="${line%%[![:space:]]*}"
                line_trimmed="${line:${#line_trimmed}}"
                if [[ "$line_trimmed" == "$fast_pass_marker" ]]; then
                  found_fast_pass=true
                  break
                fi
                [[ -z "$scan_body" ]] && break
              done
              if [[ "$found_fast_pass" == "true" ]]; then
                # All conditions met: arm the auto-merge.
                if "$gh_bin" pr merge --auto --squash --delete-branch \
                    --repo "$REPO" "$PR_NUMBER" 2>/dev/null; then
                  fast_pass_armed=true
                else
                  echo "Fast-pass auto-merge arming failed for PR #$PR_NUMBER" \
                    "but the posted status stands." >&2
                fi
              else
                echo "Fast-pass variable is true and verdict is success, but" \
                  "the fast-pass marker was not found in the review body." >&2
              fi
            else
              echo "Fast-pass variable is true but verdict is not success" \
                "(state=$state, matched_state=$matched_state)." >&2
            fi
          fi

          # What the gate judged, where a human can read it — published as a
          # pull-request review rather than an issue comment, so the report
          # arrives as a review with threads that can be anchored and
          # dispositioned. The event follows the verdict this run parsed, by
          # the same rule as `review_gate.py post`: a ship-it marker submits
          # APPROVE and a fix-required marker submits REQUEST_CHANGES, under
          # github-actions[bot], so the CI reviewer counts as an approver.
          # Anything else is a COMMENT: a review with no marker judged
          # nothing (the fail-open `success` is not a verdict), and GitHub
          # rejects the bot approving a pull request it authored. A stale
          # REQUEST_CHANGES clears when the next run on the new head, the same
          # account, approves; a marker-less or refused run submits only a
          # COMMENT, which leaves it for a human to dismiss. The poll and
          # review-event paths post no review at all: they classify GitHub's
          # own Copilot review
          # and fail open, so a bot decision there would carry no judgment.
          # While the repository setting "Allow GitHub Actions to create and
          # approve pull requests" is off, GitHub refuses a decision review;
          # that degrades to a body-only COMMENT below and never fails the
          # step, because the status above was already posted.
          #
          # Posted after the status, so a publication that fails cannot cost
          # the verdict it explains — and posted whenever this run captured
          # the text itself, verdict or none. A Copilot-authored review is
          # already on the pull request, so the poll and review-event paths
          # leave `comment_file` unset and post nothing.
          if [[ -n "$comment_file" ]]; then
            review_payload="${RUNNER_TEMP:-.}/shipd-copilot-review-payload.json"
            # The review event. Pure bash — `${var,,}` needs a newer bash than
            # macOS ships — and a decision only for a parsed marker.
            review_event=COMMENT
            case "$PR_AUTHOR" in
              ""|"github-actions[bot]") ;;
              *)
                case "$matched_state" in
                  success) review_event=APPROVE ;;
                  failure) review_event=REQUEST_CHANGES ;;
                esac ;;
            esac
            # The same payload without its inline comments. GitHub rejects a
            # whole review over one comment it will not accept, and the report
            # must not be lost to a line the API refuses, so the retry below
            # posts this instead.
            review_fallback="${RUNNER_TEMP:-.}/shipd-copilot-review-plain.json"
            # The neutral form of the same review: its body alone, event
            # COMMENT, for when GitHub refuses the decision itself.
            review_neutral="${RUNNER_TEMP:-.}/shipd-copilot-review-neutral.json"
            # The findings the reviewer left beside its report — claims, not
            # facts: that agent ran `--allow-all-tools` over a diff it cannot
            # be trusted not to be steered by. So this step checks every path
            # and range against the pull request's own diff, read at the top
            # of this step into $files_file, before anchoring anything on
            # them. A missing findings file, or a diff that could not be read,
            # anchors nothing and posts the body alone.
            findings_file="${RUNNER_TEMP:-.}/shipd-copilot-review-findings.json"
            REVIEW_UNGROUNDED="$ungrounded" REVIEW_EVENT="$review_event" "$py_bin" - "$comment_file" \
              "$findings_file" "$files_file" "$review_payload" \
              "$review_fallback" "$review_neutral" <<'PY'
          """Shape the reviewed text and the reviewer's findings into a review payload.

          Reads only workspace files and writes only workspace files: it holds no
          credential and makes no network call. Every finding is checked against the
          diff this step read itself — an entry naming a path or a range that diff does
          not carry is folded into the body as prose rather than anchored on a line the
          pull request never touched.
          """

          import json
          import os
          import re
          import sys

          body_path, findings_path, files_path, payload_path, fallback_path, \
              neutral_path = sys.argv[1:7]

          HUNK = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")
          SEVERITIES = ("high", "medium", "low")
          # The severity dot each posted finding's severity carries, matching
          # `review_gate.py`'s `_SEV_DOT` exactly, so a finding reads the same
          # whichever surface posted it.
          SEV_DOT = {"high": "\U0001F534", "medium": "\U0001F7E0",
                     "low": "\U0001F7E1"}
          MARKERS = ("<!-- shipd-verdict: ship-it -->",
                     "<!-- shipd-verdict: fix-required -->")

          # The line every posted body opens with: the same text as
          # `review_gate.py`'s `BRAND_LINE` (a parity test pins them).
          BRAND = "**☕ shipd** semantic review"


          def brand(body):
              """``body`` opened by the brand line and a blank line, unless
              its first non-blank line already is the brand line."""
              for line in body.splitlines():
                  if line.strip():
                      if line.strip() == BRAND:
                          return body
                      break
              return BRAND + "\n\n" + body


          def load(path, fallback):
              """The JSON at ``path``, or ``fallback`` when it is missing, unreadable,
              or not JSON at all. A reviewer that wrote nothing usable costs its
              anchoring, never the review."""
              try:
                  with open(path, encoding="utf-8") as handle:
                      return json.load(handle)
              except (OSError, ValueError):
                  return fallback


          def commentable(patch):
              """The RIGHT-side (new-file) line numbers a unified-diff patch makes
              commentable: context and added lines, which are the ones present on the
              side a review comment attaches to."""
              lines, number = set(), None
              for row in (patch or "").splitlines():
                  hunk = HUNK.match(row)
                  if hunk:
                      number = int(hunk.group(1))
                  elif number is None or row.startswith(("-", "\\")):
                      continue
                  else:
                      lines.add(number)
                      number += 1
              return lines


          def is_line(value):
              """True for a usable line number — an int, and not the bool that
              ``isinstance(True, int)`` would otherwise admit."""
              return isinstance(value, int) and not isinstance(value, bool)


          def placed(finding, diff):
              """The ``(path, start, end)`` a finding may be anchored on, or ``None``
              when this step could not verify it against the diff: an unknown path, a
              missing or inverted range, or a range covering a line the diff does not
              carry — which GitHub would reject, costing every other comment with it."""
              path = finding.get("path")
              start, end = finding.get("start_line"), finding.get("end_line")
              if not isinstance(path, str) or path not in diff:
                  return None
              if not (is_line(start) and is_line(end)) or start > end:
                  return None
              if not all(line in diff[path] for line in range(start, end + 1)):
                  return None
              return path, start, end


          def severity(finding):
              value = finding.get("severity")
              return value if value in SEVERITIES else "low"


          def detail(finding):
              return " ".join(str(finding.get("detail") or "").split())


          def replacement(finding):
              """The whole replacement lines a confident fix carries, or ``None``. The
              key's presence is the reviewer's confidence declaration; anything that is
              not a non-empty list of lines is not a fix this can commit."""
              lines = finding.get("replacement")
              if not isinstance(lines, list) or not lines:
                  return None
              if not all(isinstance(line, str) for line in lines):
                  return None
              return lines


          def inline_body(finding):
              """One anchored comment's body: the severity marker and the detail, plus
              the committable suggestion where the finding carries one."""
              sev = severity(finding)
              parts = ["**%s %s — %s**"
                       % (SEV_DOT[sev], sev, detail(finding))]
              lines = replacement(finding)
              if lines:
                  parts += ["", "```suggestion"] + lines + ["```"]
              parts += ["", "<!-- shipd-gate-finding -->"]
              return "\n".join(parts)


          def prose(findings):
              """The block that carries the unanchorable findings in the body, so a
              finding this step would not anchor is still reported rather than lost."""
              if not findings:
                  return []
              block = ["", "### Findings not anchored to the diff", ""]
              for finding in findings:
                  where = finding.get("path")
                  if not isinstance(where, str):
                      where = "(no location)"
                  elif is_line(finding.get("start_line")):
                      where = "%s:%s" % (where, finding["start_line"])
                  sev = severity(finding)
                  block.append("- **%s** [%s %s] — %s"
                               % (where, SEV_DOT[sev], sev, detail(finding)))
              return block


          def footer(files):
              """The stat line that closes the posted body — how much of the pull
              request the review covered, counted from the diff this step read
              itself (GitHub's per-file ``additions``/``deletions``), never from
              the reviewer's account of itself. Mirrors ``review_footer`` in
              `review_gate.py` line for line, so a review reads the same
              whichever surface posted it. Empty when the diff could not be read,
              so nothing is printed as zeros."""
              entries = [f for f in (files if isinstance(files, list) else [])
                         if isinstance(f, dict)]
              if not entries:
                  return []
              count = len(entries)
              line = "Reviewed %d file%s" % (count, "" if count == 1 else "s")
              counted = [f for f in entries
                         if is_line(f.get("additions")) or is_line(f.get("deletions"))]
              if counted:
                  added = sum(f["additions"] for f in counted
                              if is_line(f.get("additions")))
                  removed = sum(f["deletions"] for f in counted
                                if is_line(f.get("deletions")))
                  line += ", +%d -%d lines" % (added, removed)
              return ["", line + "."]


          def model_line():
              """The line under the stat line naming the model that reviewed: the
              SHIPD_REVIEW_MODEL variable this workflow passed to the CLI as
              ``--model``, or the CLI's own default where it passed none. The
              CLI runs ``-s``, so its run statistics never say."""
              model = " ".join(os.environ.get("SHIPD_REVIEW_MODEL", "").split())
              return "Model: " + (model or "Copilot CLI default")


          def stats(files):
              """The footer block: the stat line with the model line under it,
              or nothing at all where the diff could not be read, so a body
              that could not count its diff stays exactly the reviewer's."""
              block = footer(files)
              return block + [model_line()] if block else []


          def fold(body, block):
              """``body`` with ``block`` inserted above its verdict marker, so
              the marker stays the last line equal to a marker, which is what
              the gate's backwards scan reads the verdict from."""
              if not block:
                  return body
              lines = body.splitlines()
              cut = len(lines)
              for index in range(len(lines) - 1, -1, -1):
                  if lines[index].strip():
                      if lines[index].strip() in MARKERS:
                          cut = index
                      break
              folded = lines[:cut] + block + [""] + lines[cut:]
              return "\n".join(folded) + ("\n" if body.endswith("\n") else "")


          with open(body_path, encoding="utf-8", errors="replace") as handle:
              body = handle.read()

          findings = load(findings_path, [])
          if not isinstance(findings, list):
              findings = []
          files = load(files_path, [])
          diff = {}
          if isinstance(files, list):
              for entry in files:
                  if isinstance(entry, dict) and isinstance(entry.get("filename"), str):
                      diff[entry["filename"]] = commentable(entry.get("patch"))

          comments, unverified = [], []
          for finding in findings:
              if not isinstance(finding, dict):
                  continue
              # An inline comment opens a review thread, and a repository
              # requiring conversation resolution would otherwise let a `low`
              # finding block a merge the rubric says it never blocks — so
              # only `high` and `medium` findings are even offered to
              # `placed()`; a `low` one joins the unanchorable findings and
              # renders through the prose block below instead.
              if severity(finding) not in ("high", "medium"):
                  unverified.append(finding)
                  continue
              place = placed(finding, diff)
              if place is None:
                  unverified.append(finding)
                  continue
              path, start, end = place
              comment = {"path": path, "side": "RIGHT", "body": inline_body(finding)}
              if start != end:
                  comment["start_line"] = start
                  comment["start_side"] = "RIGHT"
              comment["line"] = end
              comments.append(comment)

          payload = {"commit_id": os.environ["HEAD_SHA"],
                     "event": os.environ.get("REVIEW_EVENT") or "COMMENT",
                     "body": brand(fold(body, prose(unverified)
                                        + ([] if os.environ.get("REVIEW_UNGROUNDED")
                                           else stats(files)))),
                     "comments": comments}
          with open(payload_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          payload["comments"] = []
          with open(fallback_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          payload["event"] = "COMMENT"
          with open(neutral_path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
            # Whether the review below went out as a decision — the anchored
            # review, or the same decision without its inline comments. Set
            # only on a POST that succeeded, so a failed post never asks for
            # the superseded threads to be resolved.
            decision_posted=
            if "$gh_bin" api --method POST \
                "repos/$REPO/pulls/$PR_NUMBER/reviews" \
                --input "$review_payload"; then
              decision_posted=true
            else
              # One comment GitHub will not accept rejects the whole review,
              # and the report matters more than its anchoring: retry with the
              # body alone rather than leave the pull request without it.
              echo "The anchored review of $HEAD_SHA was rejected; posting" \
                "it without inline comments."
              if "$gh_bin" api --method POST \
                  "repos/$REPO/pulls/$PR_NUMBER/reviews" \
                  --input "$review_fallback"; then
                decision_posted=true
              else
                # A refused plain retry of a decision is GitHub declining the
                # decision (typically the Actions approval setting being off),
                # not the report: submit the body alone as a COMMENT. A
                # COMMENT that fails here has no decision to drop, so it still
                # fails the step.
                if [[ "$review_event" == "COMMENT" ]]; then
                  exit 1
                fi
                echo "::warning::The $review_event decision was not" \
                  "recorded: GitHub refused it. Turn on 'Allow GitHub" \
                  "Actions to create and approve pull requests' under" \
                  "Settings, Actions, General, Workflow permissions to let" \
                  "the CI reviewer approve. Posting the review as a comment."
                "$gh_bin" api --method POST \
                  "repos/$REPO/pulls/$PR_NUMBER/reviews" \
                  --input "$review_neutral"
              fi
            fi
            # A grounded decision is a full re-review of the pull request, so
            # it supersedes every thread this gate opened on an earlier
            # commit: a finding still present was anchored again by the
            # review just posted, and a fixed one is gone. Left open, those
            # threads keep a repository that requires conversation resolution
            # blocked after the gate itself approved. This step cannot resolve
            # them: GitHub refuses `resolveReviewThread` to a token without
            # `contents: write`, and this job's token must stay read-only on
            # contents because the reviewer ran in it. So the step only says
            # so, through its outputs, and the `resolve-threads` job — which
            # holds that grant and runs no pull-request code — resolves them.
            # Only a decision that was really posted counts: a COMMENT, an
            # ungrounded review, the body-only COMMENT a refused decision
            # degrades to (it anchors no finding), and the poll paths judged
            # or re-anchored nothing, so they ask for nothing.
            if [[ -n "$decision_posted" && "$review_event" != COMMENT \
                  && -z "${ungrounded:-}" ]]; then
              echo "resolve_threads=true" >> "${GITHUB_OUTPUT:-/dev/null}"
              echo "head_sha=$HEAD_SHA" >> "${GITHUB_OUTPUT:-/dev/null}"
            fi
          fi

          # An ungrounded review judged nothing: the notice-headed COMMENT is
          # out and `pending` stands, and the job fails so the run does not
          # read as a pass.
          if [[ -n "${ungrounded:-}" ]]; then
            exit 1
          fi

  resolve-threads:
    name: Resolve the gate's superseded review threads
    # Runs after the `gate` job, and only when its posting step reported a
    # grounded APPROVE or REQUEST_CHANGES that GitHub accepted for the head
    # this run was triggered for. A guard with no status function carries the
    # implicit `success()`, so a `gate` job that was skipped (a review event
    # by anyone but Copilot, or of an older commit), failed, or was cancelled
    # skips this one too. The review-event path posts no review of its own,
    # so it never sets the outputs either. The workflow-level concurrency
    # group covers this job as well: a new push cancels the whole run, and
    # the new head's own run resolves whatever this one left open, since it
    # selects every gate thread made on a commit other than its own head.
    needs: gate
    if: >-
      github.event_name == 'pull_request'
      && needs.gate.outputs.resolve_threads == 'true'
      && needs.gate.outputs.head_sha == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    # The one job granted `contents: write`. GitHub refuses the
    # `resolveReviewThread` mutation to a workflow token without it — measured
    # as "Resource not accessible by integration" under `contents: read` with
    # `pull-requests: write` — although the mutation changes no repository
    # content. Granted here, at job level, rather than to the workflow, so the
    # `gate` job, where the Copilot CLI runs over a diff it cannot be trusted
    # not to be steered by, never holds a write token for contents. This job
    # checks nothing out, uses no action, binds no secret, and runs no code
    # from the pull request: its token only ever reaches `gh api graphql`.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve the gate's threads from earlier commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The head the decision review was posted for, which the guard
          # above already matched against the event's own head.
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Only the gate's own threads: a first comment by
          # `github-actions[bot]` (GraphQL reports a bot's login without the
          # `[bot]` suffix, so both spellings count) whose last non-blank
          # line is the marker the gate's own inline comments carry (another
          # Actions workflow's threads lack it), unresolved, and made on
          # a commit other than this head — the review just posted anchored
          # its own threads on this head, so they are never touched. Only the
          # first 100 threads are read. Anything that goes wrong here only
          # warns and the job still passes: the status and the review are
          # already posted, and these calls must never change them.
          #
          # A plain PATH lookup for `gh` and `python3` is fine here, unlike in
          # the `gate` job's posting step: no reviewer ran in this job, so
          # there is no $GITHUB_PATH entry of the reviewer's to find.
          threads_file="${RUNNER_TEMP:-.}/shipd-copilot-review-threads.json"
          stale_file="${RUNNER_TEMP:-.}/shipd-copilot-review-stale-threads.txt"
          rm -f "$threads_file" "$stale_file"
          threads_query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                reviewThreads(first: 100) {
                  nodes {
                    id
                    isResolved
                    comments(first: 1) {
                      nodes { author { login } body originalCommit { oid } }
                    }
                  }
                }
              }
            }
          }'
          resolve_mutation='mutation($threadId: ID!) {
            resolveReviewThread(input: {threadId: $threadId}) {
              thread { isResolved }
            }
          }'
          if ! gh api graphql -f query="$threads_query" \
              -f owner="${REPO%%/*}" -f name="${REPO#*/}" \
              -F number="$PR_NUMBER" > "$threads_file"; then
            echo "::warning::Could not list the review threads of PR" \
              "#$PR_NUMBER, so the gate's superseded threads stay open."
          elif ! python3 - "$threads_file" "$stale_file" <<'PY'
          """Select the gate's own unresolved threads made on an earlier commit.

          Reads the GraphQL reviewThreads answer and writes one thread id per line.
          An answer that is not the expected JSON exits nonzero, which only warns.
          """

          import json
          import os
          import sys

          GATE = ("github-actions", "github-actions[bot]")
          MARKER = "<!-- shipd-gate-finding -->"
          with open(sys.argv[1], encoding="utf-8") as handle:
              answer = json.load(handle)
          nodes = answer["data"]["repository"]["pullRequest"]["reviewThreads"]["nodes"]
          stale = []
          for node in nodes if isinstance(nodes, list) else []:
              if not isinstance(node, dict) or node.get("isResolved") is not False:
                  continue
              if not isinstance(node.get("id"), str):
                  continue
              first = ((node.get("comments") or {}).get("nodes") or [None])[0]
              if not isinstance(first, dict):
                  continue
              if (first.get("author") or {}).get("login") not in GATE:
                  continue
              body = first.get("body")
              lines = [l.strip() for l in body.splitlines() if l.strip()] \
                  if isinstance(body, str) else []
              if not lines or lines[-1] != MARKER:
                  continue
              if (first.get("originalCommit") or {}).get("oid") == os.environ["HEAD_SHA"]:
                  continue
              stale.append(node["id"])
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write("".join(thread + "\n" for thread in stale))
          PY
          then
            echo "::warning::Could not read the review threads of PR" \
              "#$PR_NUMBER, so the gate's superseded threads stay open."
          else
            while IFS= read -r thread_id; do
              [[ -n "$thread_id" ]] || continue
              if gh api graphql -f query="$resolve_mutation" \
                  -f threadId="$thread_id" > /dev/null; then
                echo "Resolved superseded gate review thread $thread_id."
              else
                echo "::warning::Could not resolve the superseded gate" \
                  "review thread $thread_id; it stays open."
              fi
            done < "$stale_file"
          fi
